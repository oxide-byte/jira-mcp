[package]
name = "jira-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"
serde_json = "1.0.151"
ratatui = "0.30.2"
crossterm = "0.29.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
chrono = "0.4.45"
reqwest = { version = "0.13.4", features = ["json"] }
anyhow = "1.0.104"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
parking_lot = "0.12.5"
dotenvy = "0.15.7"
base64 = "0.23.1"